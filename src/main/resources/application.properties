spring.application.name=sse-demo
server.port=8081

# Configurações para logs
logging.level.br.com.sse=INFO
logging.level.org.springframework.web=INFO

# Configurações para compressão de resposta
server.compression.enabled=true
# text/event-stream fica de fora: o gzip acumula eventos em buffer e atrasa o stream
server.compression.mime-types=application/json,text/html,text/css,application/javascript
server.compression.min-response-size=1024

# Configurações para cache
spring.web.resources.cache.cachecontrol.max-age=3600
spring.web.resources.cache.cachecontrol.must-revalidate=true

# Configurações SSE
sse.emitter-timeout-ms=1800000
sse.heartbeat-interval-ms=20000
